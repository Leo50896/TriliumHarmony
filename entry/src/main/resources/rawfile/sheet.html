<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="luckysheet/plugins/css/pluginsCss.css">
<link rel="stylesheet" href="luckysheet/plugins/plugins.css">
<link rel="stylesheet" href="luckysheet/css/luckysheet.css">
<link rel="stylesheet" href="luckysheet/assets/iconfont/iconfont.css">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0D131C; overflow:hidden; }
  #luckysheet { position:absolute; inset:0; }
  .luckysheet_info_detail, .luckysheet-sheet-container { display:none !important; }
</style>
</head>
<body>
<div id="luckysheet"></div>
<script src="luckysheet/plugins/js/plugin.js"></script>
<script src="luckysheet/luckysheet.umd.js"></script>
<script>
  (function () {
    var created = false;
    var workbook = {};
    var sheetId = '';
    var rawJson = '';
    var readOnly = true;
    var stylesMap = {};
    function pad(value) { return value < 10 ? '0' + value : '' + value; }
    function excelDate(serial, pattern) {
      var date = new Date(Math.round((serial - 25569) * 86400000));
      return pattern
        .replace(/yyyy/g, '' + date.getUTCFullYear())
        .replace(/MM/g, pad(date.getUTCMonth() + 1))
        .replace(/dd/g, pad(date.getUTCDate()))
        .replace(/hh/g, pad(date.getUTCHours()))
        .replace(/mm/g, pad(date.getUTCMinutes()))
        .replace(/ss/g, pad(date.getUTCSeconds()));
    }
    function displayValue(cell) {
      var style = cell.s;
      if (typeof style === 'string') style = stylesMap[style] || {};
      if (!style || typeof style !== 'object') style = {};
      var pattern = style.n && style.n.pattern;
      if (pattern && typeof cell.v === 'number' && /[yMdHhms]/.test(pattern)) {
        return excelDate(cell.v, pattern);
      }
      if (cell.m !== undefined && cell.m !== null && String(cell.m).length > 0) {
        return String(cell.m);
      }
      return cell.v !== undefined && cell.v !== null ? cell.v : '';
    }
    function bridge(name, value) {
      try {
        if (window.NativeSheetBridge && typeof window.NativeSheetBridge[name] === 'function') {
          window.NativeSheetBridge[name](value);
        }
      } catch (e) {}
    }
    function toCellData(sheet) {
      var data = [];
      var cellData = sheet.cellData || {};
      Object.keys(cellData).forEach(function (r) {
        Object.keys(cellData[r] || {}).forEach(function (c) {
          var cell = cellData[r][c] || {};
          var rawValue = displayValue(cell);
          var item = { r: Number(r), c: Number(c),
            v: cell.m !== undefined ? String(cell.m) :
              (rawValue !== undefined && rawValue !== null ? rawValue : '') };
          if (cell.m !== undefined) item.m = String(cell.m);
          if (cell.f) item.f = cell.f;
          data.push(item);
        });
      });
      return data;
    }
    window.NativeSheet = {
      render: function (json) {
        rawJson = json || '{}';
        try { workbook = JSON.parse(rawJson); } catch (e) { workbook = {}; }
        var wb = workbook.workbook || workbook;
        stylesMap = wb.styles || {};
        var sheetMap = wb.sheets || {};
        var order = wb.sheetOrder || Object.keys(sheetMap);
        sheetId = order.length > 0 ? order[0] : '';
        var sheet = sheetMap[sheetId] || {};
        var data = [{
          name: sheet.name || 'Sheet1',
          color: '#0A84FF',
          status: '1',
          order: '0',
          celldata: toCellData(sheet),
          config: {}
        }];
        if (created && window.luckysheet && luckysheet.getAllSheets) {
          luckysheet.destroy();
          created = false;
        }
        luckysheet.create({
          container: 'luckysheet',
          data: data,
          lang: 'en',
          showinfobar: false,
          showtoolbar: false,
          showsheetbar: false,
          showstatisticBar: false,
          allowEdit: !readOnly,
          enableAddRow: false,
          enableAddBackTop: false,
          hook: {
            workbookCreateAfter: function () {
              created = true;
              bridge('ready', 'ok');
            }
          }
        });
        setTimeout(function () {
          bridge('ready', 'ok');
        }, 1200);
      },
      setReadOnly: function (value) {
        if (readOnly === value) {
          return;
        }
        readOnly = value;
        try {
          if (created && rawJson.length > 0) {
            luckysheet.destroy();
            created = false;
            window.NativeSheet.render(rawJson);
          }
        } catch (e) {}
      },
      getJson: function () {
        try {
          var live = luckysheet.getAllSheets()[0] || {};
          var cells = live.data || live.celldata || [];
          var cellData = {};
          for (var i = 0; i < cells.length; i++) {
            var item = cells[i];
            if (!cellData[item.r]) cellData[item.r] = {};
            var cell = {};
            if (item.v !== undefined) cell.v = item.v;
            if (item.m !== undefined) cell.m = String(item.m);
            if (item.f) cell.f = item.f;
            cellData[item.r][item.c] = cell;
          }
          workbook.sheets = workbook.sheets || {};
          var wb = workbook.workbook || workbook;
          wb.sheets = wb.sheets || {};
          if (!sheetId) {
            sheetId = 'sheet-01';
          }
          wb.sheets[sheetId] = wb.sheets[sheetId] || {};
          wb.sheets[sheetId].cellData = cellData;
          if (!wb.sheetOrder || wb.sheetOrder.length === 0) {
            wb.sheetOrder = [sheetId];
          }
          return JSON.stringify(workbook);
        } catch (e) {
          return JSON.stringify(workbook);
        }
      },
      getAndSend: function () {
        var live = luckysheet.getAllSheets()[0] || {};
        var merge = (live.config && live.config.merge) || [];
        var sourceBook = workbook.workbook || workbook;
        var sourceSheet = (sourceBook.sheets && sourceBook.sheets[sheetId]) || {};
        var sourceMerge = sourceSheet.mergeData || [];
        var hasComplex = false;
        var cells = live.data || live.celldata || [];
        for (var i = 0; i < cells.length; i++) {
          if (cells[i] && cells[i].f) {
            hasComplex = true;
            break;
          }
        }
        if (sourceSheet.dataVerification && sourceSheet.dataVerification.length > 0) {
          hasComplex = true;
        }
        if (merge.length > 0 || sourceMerge.length > 0 || hasComplex) {
          bridge('showAlert', '包含合并单元格、公式或数据验证的表格暂不支持手机端保存，请前往桌面端修改。');
          return false;
        }
        bridge('json', this.getJson());
        return true;
      }
    };
  })();
</script>
</body>
</html>
